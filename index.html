<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lieven Lekens</title>
<meta name="description" content="Lieven Lekens — Managing Partner Feriados en Mali Media Group.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f6f3ee;
    --ink: #1d1d1b;
    --muted: #6b6760;
    --line: #d9d3c8;
    --accent: #0a66c2;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #161614; --ink: #f1ede6; --muted: #a39e94; --line: #34322e; --accent: #4c9be8; }
  }
  * { box-sizing: border-box; margin: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    display: grid;
    place-items: center;
    padding: 24px 16px;
  }
  main { width: 100%; max-width: 520px; }
  .rule { width: 48px; height: 2px; background: var(--ink); margin-bottom: 32px; }
  h1 {
    font-family: "Fraunces", Georgia, serif;
    font-weight: 500;
    font-size: clamp(2.6rem, 9vw, 3.6rem);
    line-height: 1.05;
    letter-spacing: -0.02em;
  }
  .role { margin-top: 16px; font-size: 1.05rem; color: var(--muted); line-height: 1.6; }
  .actions { margin-top: 40px; padding-top: 24px; border-top: 1px solid var(--line); }
  a.btn {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 12px 20px; border-radius: 999px;
    background: var(--ink); color: var(--bg);
    font-weight: 500; text-decoration: none; font-size: 0.95rem;
    transition: opacity .15s ease;
  }
  a.btn:hover { opacity: .85; }
  a.btn svg { width: 18px; height: 18px; fill: currentColor; }
  footer { margin-top: 56px; font-size: 0.8rem; color: var(--muted); }
</style>
</head>
<body>
  <main>
    <div class="rule"></div>
    <h1>Lieven Lekens</h1>
    <p class="role">Managing Partner Feriados en Mali Media Group</p>
    <div class="actions">
      <a class="btn" href="LINKEDIN_URL" rel="noopener">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.45 20.45h-3.56v-5.57c0-1.33-.02-3.04-1.85-3.04-1.85 0-2.14 1.45-2.14 2.94v5.67H9.34V9h3.42v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28zM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13zM7.12 20.45H3.56V9h3.56v11.45zM22.22 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0z"/></svg>
        Bekijk mijn LinkedIn
      </a>
    </div>
    <footer>lievenlekens.be</footer>
  </main>
</body>
</html>
